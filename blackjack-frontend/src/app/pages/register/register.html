<div class="reg-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="suits-bg">♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣ ♠ ♥ ♦ ♣</div>

  <div class="stage">
    <div class="logo-block">
      <div class="eyebrow">Multiplayer</div>
      <div class="logo-title">Blackjack</div>
      <div class="logo-sub">Crear Cuenta</div>
    </div>

    <!-- Success state -->
    <div class="glass-card" *ngIf="success">
      <div class="shimmer-top"></div>
      <div class="success-block">
        <div class="success-icon">✓</div>
        <div class="success-title">¡Registro Exitoso!</div>
        <div class="success-sub">Redirigiendo al inicio de sesión...</div>
      </div>
    </div>

    <!-- Register form -->
    <div class="glass-card" *ngIf="!success">
      <div class="shimmer-top"></div>

      <div class="section-label">Usuario</div>
      <div class="input-wrap">
        <span class="input-icon">♠</span>
        <input type="text" [(ngModel)]="username" placeholder="Mínimo 3 caracteres..." (keyup.enter)="register()" />
      </div>

      <div class="section-label">Contraseña</div>
      <div class="input-wrap">
        <span class="input-icon">◈</span>
        <input type="password" [(ngModel)]="password" placeholder="Mínimo 4 caracteres..." (keyup.enter)="register()" />
      </div>

      <div class="section-label">Confirmar Contraseña</div>
      <div class="input-wrap" [class.mismatch]="confirmPassword && password !== confirmPassword">
        <span class="input-icon">◈</span>
        <input type="password" [(ngModel)]="confirmPassword" placeholder="Repite tu contraseña..." (keyup.enter)="register()" />
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Color de Avatar</span>
        <div class="divider-line"></div>
      </div>

      <div class="section-label">Elige tu color</div>
      <div class="avatar-row">
        <div
          *ngFor="let color of colors"
          class="avatar-dot"
          [class.selected]="selectedColor === color"
          [style.background]="color"
          (click)="selectColor(color)">
        </div>
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button class="btn-register" (click)="register()" [disabled]="loading">
        <span *ngIf="!loading">✦ CREAR CUENTA</span>
        <span *ngIf="loading" class="loading-dots">...</span>
      </button>

      <div class="card-footer">
        ¿Ya tienes cuenta?
        <span class="link" (click)="goToLogin()">Inicia sesión</span>
      </div>
    </div>
  </div>
</div>
